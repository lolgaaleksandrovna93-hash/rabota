plugins {
    id 'java'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'
sourceCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    
    // Selenium (можно использовать либо эту версию, либо OpenSelenium)
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.29.0' 

    // Альтернатива — библиотека OpenSelenium (рекомендуется)
//     testImplementation group: 'org.openselenium', name: 'webdriver', version: '6.8.3'
//     testImplementation group: 'org.openselenium', name: 'extensions', version: '6.8.3'
}

test {
    useJUnitPlatform()  
}
