plugins {
    id 'java'
    // УБРАНО: id 'org.springframework.boot' и 'io.spring.dependency-management'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    // Selenium и современные тесты лучше работают на Java 17+
    sourceCompatibility = '17'
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

dependencies {
    // УБРАНО: spring-boot-starter-web
    
    // Тесты
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.29.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.3'
}

test {
    useJUnitPlatform()
}
