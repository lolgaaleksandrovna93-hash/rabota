plugins {
    id 'java'
    // ЭТО САМОЕ ВАЖНОЕ: этот плагин делает JAR исполняемым и добавляет сервер
    id 'org.springframework.boot' version '3.2.0'
    // Этот плагин управляет версиями библиотек Spring
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '11'
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

dependencies {
    // ЭТО ДАЕТ ВЕБ-СЕРВЕР (Tomcat) и возможность слушать порт 9999
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Тесты (JUnit + Selenium)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.29.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.3'
}

test {
    useJUnitPlatform()
    // Если понадобится передавать опции Chrome через systemProperty
    systemProperty 'chromeoptions.prefs', System.getProperty('chromeoptions.prefs', "profile.password_manager_leak_detection=false")
}
