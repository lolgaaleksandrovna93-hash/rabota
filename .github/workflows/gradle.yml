name: Java CI with Gradle (Selenium + Spring Boot)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build SUT (Application) 📦
        # Важно: эта команда должна создать ИСПОЛНЯЕМЫЙ JAR (см. инструкцию ниже)
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      - name: Start SUT and wait for readiness 🚀
        shell: cmd
        run: |
          @echo off
          setlocal enabledelayedexpansion

          REM 1. Поиск JAR файла
          echo [INFO] Поиск JAR-файла в build/libs...
          set "JAR_FILE="
          for %%f in (build\libs\*.jar) do (
            set "JAR_FILE=%%f"
            goto :found_jar
          )

          :found_jar
          if "%JAR_FILE%"=="" (
            echo [ERROR] КРИТИЧЕСКАЯ ОШИБКА: JAR файл не найден в build\libs!
            dir build\libs /b 2>nul
            exit /b 1
          )
          echo [SUCCESS] Найден файл: %JAR_FILE%

          REM 2. Запуск приложения
          echo [INFO] Запуск приложения в фоне...
          
          REM ВАЖНО: Убрали "> %TEMP%\sut-output.log 2>&1" из команды start.
          REM В Windows start /B не поддерживает перенаправление потоков, это вызывало краш.
          REM Логи Java теперь пишутся прямо в консоль шага GitHub Actions.
          start /B java -jar "%JAR_FILE%"

          REM Небольшая пауза, чтобы приложение начало инициализацию
          timeout /t 5 /nobreak >nul

          REM 3. Проверка порта 9999 (основной индикатор готовности Spring Boot)
          echo [INFO] Проверка доступности порта 9999...
          set "MAX_ATTEMPTS=60"
          set "ATTEMPT=0"

          :wait_port
          if !ATTEMPT! GEQ !MAX_ATTEMPTS! (
            echo [ERROR] Таймаут: порт 9999 не открылся за 2 минуты.
            echo Проверьте, что server.port=9999 в application.properties.
            echo Проверьте логи выше — возможно, приложение упало из-за ошибки запуска (no main class).
            exit /b 1
          )

          REM Проверка порта через PowerShell (это единственный надежный способ в Windows без установки curl/telnet)
          powershell -Command "try { $c = New-Object System.Net.Sockets.TcpClient('localhost', 9999); $c.Close(); exit 0 } catch { exit 1 }"
          
          if not errorlevel 1 (
            echo [SUCCESS] Порт 9999 открыт! SUT готов к работе.
            goto :final_pause
          )

          set /a ATTEMPT+=1
          echo [WAIT] Порт 9999 еще не открыт... (!ATTEMPT!/!MAX_ATTEMPTS!)
          timeout /t 2 /nobreak >nul
          goto :wait_port

          :final_pause
          echo [INFO] Финальная пауза 10 секунд для полной инициализации контекста...
          timeout /t 10 /nobreak >nul
          echo [SUCCESS] SUT полностью готов к запуску тестов!

      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
