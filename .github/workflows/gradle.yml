name: Java CI with Gradle (Selenium + Spring Boot)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # 1. Поиск JAR файла
          # Используем простую команду без лишних переменных окружения
          \$jarFile = Get-ChildItem -Path "./build/libs" -Filter "app-order*.jar" | Select-Object -First 1

          if ($null -eq $jarFile) {
            Write-Error "❌ КРИТИЧЕСКАЯ ОШИБКА: JAR файл не найден в ./build/libs!"
            Write-Host "Доступные файлы в папке:"
            Get-ChildItem -Path "./build/libs" -Filter "*.jar" | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }

          Write-Host "🟢 Найден файл: $($jarFile.Name)"

          # 2. Запуск приложения в фоне
          # Перенаправляем вывод в лог-файл для отладки
          \$process = Start-Process `
            -FilePath "java" `
            -ArgumentList "-jar", "`"$($jarFile.FullName)`"" `
            -NoNewWindow `
            -PassThru `
            -RedirectStandardOutput "\$env:TEMP/sut-output.log"

          # 3. Ожидание сообщения о старте Spring Boot
          Write-Host "⏳ Ожидание сообщения 'Started ... in X.X seconds'..."
          \$maxWait = 120
          \$count = 0
          
          while ($count -lt $maxWait) {
            Start-Sleep -Seconds 1
            if (Test-Path "\$env:TEMP/sut-output.log") {
              $lastLine = Get-Content "$env:TEMP/sut-output.log" -Tail 1
              if (\$lastLine -match "Started .* in \d+\.\d+ seconds") {
                Write-Host "✅ Приложение сообщило о готовности: \$lastLine"
                break
              }
            }
            \$count++
          }

          if ($count -ge $maxWait) {
            Write-Error "🛑 Таймаут: приложение не запустилось за 2 минуты."
            Get-Content "$env:TEMP/sut-output.log" -Tail 50 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id \$process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # 4. Проверка доступности порта 9999
          Write-Host "⏳ Проверка доступности порта 9999..."
          \$maxAttempts = 60
          \$attempt = 0
          
          while ($attempt -lt $maxAttempts) {
            try {
              \$client = New-Object System.Net.Sockets.TcpClient("localhost", 9999)
              \$client.Close()
              Write-Host "🟢 Порт 9999 открыт! SUT готов к работе."
              break
            } catch {
              Write-Host "⏳ Порт 9999 еще не открыт... ($($attempt + 1)/\$maxAttempts)"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Таймаут: порт 9999 не открылся."
            Get-Content "$env:TEMP/sut-output.log" -Tail 50 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id \$process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # 5. Финальная пауза для полной инициализации
          Write-Host "⏳ Финальная пауза 10 секунд для полной инициализации..."
          Start-Sleep -Seconds 10
          Write-Host "✅ SUT полностью готов к запуску тестов!"

      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
