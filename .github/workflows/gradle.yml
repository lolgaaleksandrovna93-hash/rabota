name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ЭТАП 1. Подготовка окружения (код + JDK)
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/actions/setup-java@v3 # Используем официальный action от GitHub
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle # Кэшируем зависимости Gradle

      # ЭТАП 2. Установка браузера Chrome
      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ЭТАП 3. Сборка проекта (получение JAR-файла из нестандартной папки artifacts/)
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      # ЭТАП 4. Запуск приложения с ожиданием готовности 🚀
      # ✅ ИСПРАВЛЕННЫЙ СКРИПТ ДЛЯ НЕСТАНДАРТНОЙ ПАПКИ ARTIFACTS
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # Ждём появления артефакта после сборки
          $maxWait = 60
          while ($true) {
            if (Test-Path "./artifacts/app-order.jar") { break }
            Write-Host "⏳ Ожидаем создания JAR... попытка $($maxWait)"
            Start-Sleep -Seconds 1
            $maxWait--
            if ($maxWait -eq 0) {
              exit 1
            }
          }

          # Запускаем приложение из папки artifacts
          $jarPath = "./artifacts/app-order.jar"
          Write-Host "🟢 Запускаем приложение из $jarPath" # Для логов

          # ❗️ ИСПРАВИЛ СИНТАКСИС! Теперь путь передаётся корректно.
          $process = Start-Process `
              -FilePath 'java' `                     # В одинарных кавычках!
              -ArgumentList '-jar', "$jarPath" `     # Без лишних обратных слэшей (``)
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "$env:TMP/sut-output.log"

          # Ждём сообщение Spring Boot о старте
          $maxWaitSpring = 90
          while ($true) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 1
            if ($output -match 'Started .* in \d+\.\d+ seconds') {
                Write-Host "🟢 Spring Boot сообщил о старте."
                break;
            }
          }

          # Проверка порта TCP
          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient
              $tcp.Connect("localhost", 9999)
              $tcp.Close()
              Write-Host "🟢 Порт 9999 открыт!"
              break
            } catch {
              Write-Host "⏳ Ожидаем открытия порта... попытка $($attempt + 1)/$maxAttempts"
            }
            $attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Не удалось запустить SUT. Порт 9999 не открылся."
            Stop-Process -Id $process.Id -Force
            exit 1
          }

          # Пауза перед тестами для полной инициализации контекста
          Write-Host "⏳ Дополнительная пауза на 15 секунд..."
          Start-Sleep -Seconds 15

      # ЭТАП 5. Запуск тестов 🎯
      # ВАЖНО: Мы НЕ ПЕРЕДАЕМ переменную WEBDRIVER_CHROME_DRIVER вручную!
      # Action setup-chrome уже поставил её автоматически в системные переменные ОС.
      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      # ЭТАП 6. Загрузка отчёта
      - name: Upload Test Report 🗃️
        if: always() # Скачивается даже при падении тестов
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
