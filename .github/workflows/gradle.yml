name: Java CI with Gradle (Windows CI)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - uses: actions/checkout@v4

      # ❗️ Установка JDK обязательна!
      - name: Set up JDK 17 (или 11)
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Или '11'
          distribution: 'temurin'

      # ❗️ Новый шаг! Устанавливаем Chrome
      - name: Install Google Chrome
        uses: actions/setup-chrome@v2
        with:
          chrome-version: stable

      # ❗️ Настройка WebDriverManager
      # Если вы используете WDM, добавьте этот флаг к сборке,
      # чтобы он скачал хромдрайвер под текущую версию Chrome.
      # Флаг --system-properties нужен только если у вас старая версия WDM.
      - name: Build project and create artifacts
        run: .\gradlew.bat build --stacktrace --system-properties "webdriver.chrome.driver=src/test/resources/chromedriver.exe"

      # Запуск приложения
      - name: Start SUT in background
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "java" `
            -ArgumentList "-jar", ".\\build\\libs\\raboata.jar" `
            -NoNewWindow `
            -RedirectStandardOutput "./sut.log" `
            -PassThru # Возвращает объект процесса

          Write-Host "Application started with PID $($process.Id). Waiting for readiness..."

          while ($true) {
            if ((Get-Content ./sut.log | Select-String -SimpleMatch "Server is running") -ne $null) {
              Write-Host "✅ Application is ready!"
              break;
            }
            Start-Sleep -Milliseconds 200
          }

      # Тесты
      - name: Run tests
        run: .\gradlew.bat test --info

      # Отчёты
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

