name: Java CI with Gradle (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest  # <-- ВАЖНО: меняем ubuntu на windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Gradle
        run: .\gradlew.bat build  # <-- ВАЖНО: используем .bat

      - name: Start SUT and wait (PowerShell)
        shell: pwsh  # <-- ВАЖНО: используем PowerShell вместо bash
        run: |
          # Запускаем приложение в фоне
          Start-Process -FilePath "java" -ArgumentList "-jar", ".\artifacts\app-order.jar"
          
          # Ждем запуска (пробуем достучаться до порта)
          \$maxAttempts = 30
          \$attempt = 0
          \$url = "http://localhost:9999"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -ErrorAction Stop
              if (\$response.StatusCode -eq 200) {
                Write-Host "SUT is ready!"
                break
              }
            } catch {
              Write-Host "Waiting for SUT... attempt $($attempt + 1)"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

      - name: Run tests
        run: .\gradlew.bat test  # <-- ВАЖНО: используем .bat
