name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 1. ЗАПУСК ПРИЛОЖЕНИЯ (SUT) — cmd + start /B для фонового режима
      - name: Start SUT (Application)
        shell: cmd
        run: |
          start /B java -jar artifacts/app-order.jar
          echo SUT started in background...

      # 2. ОЖИДАНИЕ ГОТОВНОСТИ ПРИЛОЖЕНИЯ — чистый cmd, без PowerShell
      - name: Wait for SUT to be ready
        shell: cmd
        run: |
          set MAX_RETRIES=60
          set RETRY_COUNT=0
          
          :loop
          if %RETRY_COUNT% GEQ %MAX_RETRIES% (
            echo SUT failed to start within timeout!
            exit /b 1
          )
          
          echo Checking port 9999... (attempt %RETRY_COUNT%/%MAX_RETRIES%)
          
          REM Ищем строку с LISTENING на порту 9999
          netstat -an | findstr ":9999" | findstr "LISTENING" >nul
          
          if %errorlevel% EQU 0 (
            echo Port 9999 is open! SUT is ready.
            exit /b 0
          )
          
          set /a RETRY_COUNT+=1
          timeout /t 1 /nobreak >nul
          goto loop

      # 3. ЗАПУСК ТЕСТОВ
      - name: Run tests
        env:
          WEBDRIVER_CHROME_DRIVER: %CHROME_DRIVER_PATH%
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/
