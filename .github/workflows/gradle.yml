name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ЭТАП 1. Подготовка окружения
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle' # Используем кэш gradle для ускорения сборки

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ЭТАП 2. Сборка проекта (чтобы получить JAR)
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      # ЭТАП 3. Запуск SUT с длительным ожиданием готовности
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # Автоматически находим JAR по маске (чтобы не зависеть от версии)
          $jarFiles = Get-ChildItem -Path "./build/libs" -Filter "rabota*.jar"
          
          if ($null -eq $jarFiles) {
            Write-Error "JAR файл не найден!"
            exit 1
          }

          # Берём первый найденный JAR-файл
          $jarPath = $jarFiles[0].FullName
          Write-Host "Запускаем приложение из файла: $jarPath"

          # Запускаем процесс в фоне
          $process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "$env:TMP/sut-output.log"

          # Ждём сообщение Spring Boot о готовности
          while ($true) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 1
            if ($output -match 'Responding at') { # Сообщение из Spring Boot
                Write-Host "🟢 Приложение сообщило о готовности."
                break;
            }
          }

          # Проверка порта TCP с увеличенным таймаутом (~4 минуты)
          $maxAttempts = 120
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient
              $tcp.Connect("localhost", 9999)
              $tcp.Close()
              Write-Host "🟢 Порт 9999 открыт!"
              break
            } catch {
              Write-Host "⏳ Ожидаем открытия порта... попытка $($attempt + 1)"
            }
            $attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Не удалось запустить SUT. Порт 9999 так и не открылся."
            Stop-Process -Id $process.Id -Force
            exit 1
          }

          # Финальная длительная пауза для полной инициализации контекста Spring
          Write-Host "⏳ Дополнительное ожидание на 20 секунд..."
          Start-Sleep -Seconds 20

      # ЭТАП 4. Запуск тестов
      - name: Run tests 🎯
        env:
          WEBDRIVER_CHROME_DRIVER: ${{ env.CHROME_DRIVER_PATH }}
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
