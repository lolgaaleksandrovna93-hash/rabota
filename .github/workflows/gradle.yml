name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # --- ГЛАВНОЕ ИСПРАВЛЕНИЕ НАЧИНАЕТСЯ ЗДЕСЬ ---
      
      # 1. ЗАПУСК ПРИЛОЖЕНИЯ (SUT)
      # Мы запускаем jar-файл в фоне, чтобы тесты могли работать параллельно
      - name: Start SUT (Application)
        run: |
          Start-Process -NoNewWindow -PassThru -FilePath "java" -ArgumentList "-jar", "./artifacts/app-order.jar"
          Write-Host "SUT started. Waiting for port 9999..."
        shell: powershell

      # 2. ОЖИДАНИЕ ГОТОВНОСТИ ПРИЛОЖЕНИЯ
      # Ждем, пока порт 9999 станет доступен (максимум 60 секунд)
      - name: Wait for SUT to be ready
        run: |
          \$maxRetries = 60
          \$retryCount = 0
          while ($retryCount -lt $maxRetries) {
            try {
              \$tcp = New-Object System.Net.Sockets.TcpClient
              \$tcp.Connect("127.0.0.1", 9999)
              \$tcp.Close()
              Write-Host "Port 9999 is open! SUT is ready."
              break
            } catch {
              Write-Host "Waiting for SUT... ($retryCount/$maxRetries)"
              Start-Sleep -Seconds 1
              \$retryCount++
            }
          }
          if ($retryCount -eq $maxRetries) {
            Write-Error "SUT failed to start within timeout!"
            exit 1
          }
        shell: powershell

      # 3. ЗАПУСК ТЕСТОВ
      # ВАЖНО: Передаем переменную окружения с путем к драйверу, который скачал browser-actions
      - name: Run tests
        env:
          WEBDRIVER_CHROME_DRIVER: \${{ env.CHROME_DRIVER_PATH }}
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      # ---------------------------------------------

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/

