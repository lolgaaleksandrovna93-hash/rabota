name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ЭТАП 1: Checkout кода
      - name: Checkout code 📁
        uses: actions/checkout@v4

      # ЭТАП 2: Установка JDK (ИСПРАВЛЕНО: правильный action)
      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      # ЭТАП 3: Установка Chrome
      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ЭТАП 4: Сборка проекта
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      # ЭТАП 5: Запуск SUT и ожидание готовности
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # 1. АВТОМАТИЧЕСКИЙ ПОИСК JAR В build/libs
          # Ищем файл, начинающийся с app-order и заканчивающийся на .jar
          \$jarFile = Get-ChildItem -Path "./build/libs/" -Filter "app-order*.jar" | Select-Object -First 1

          if ($null -eq $jarFile) {
            Write-Error "❌ JAR файл не найден в build/libs!"
            Write-Host "Доступные файлы в build/libs:"
            Get-ChildItem -Path "./build/libs/" -Filter "*.jar" | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }

          $jarPath = $jarFile.FullName
          Write-Host "🟢 Найден JAR: \$jarPath"

          # 2. Запуск процесса
          \$process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "\$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "\$env:TMP/sut-output.log"

          # 3. Ждем сообщение Spring Boot о старте
          \$maxWaitSpring = 120
          \$attempt = 0
          while ($attempt -lt $maxWaitSpring) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TMP/sut-output.log" -Tail 1
            
            if (\$output -match 'Started .* in \d+\.\d+ seconds') {
                Write-Host "✅ Приложение сообщило о готовности: \$output"
                break
            }
            \$attempt++
          }

          if ($attempt -ge $maxWaitSpring) {
            Write-Error "🛑 Таймаут ожидания сообщения 'Started...'. Лог:"
            Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 20 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id \$process.Id -Force
            exit 1
          }

          # 4. Проверка порта TCP
          \$maxAttempts = 120
          \$attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              \$tcp = New-Object System.Net.Sockets.TcpClient
              \$tcp.Connect("localhost", 9999)
              \$tcp.Close
              Write-Host "🟢 Порт 9999 открыт!"
              break
            } catch {
              Write-Host "⏳ Порт 9999 еще не открыт... попытка $($attempt + 1)/\$maxAttempts"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Таймаут проверки порта 9999."
            Stop-Process -Id \$process.Id -Force
            exit 1
          }

          # 5. Финальная пауза
          Write-Host "⏳ Финальная пауза 20 секунд..."
          Start-Sleep -Seconds 20

      # ЭТАП 6: Запуск тестов
      - name: Run tests 🎯
