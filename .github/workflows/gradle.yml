name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ЭТАП 1: Подготовка окружения (код, JDK, браузер, драйверы)
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ЭТАП 2: Сборка приложения (чтобы получить JAR для запуска SUT)
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test
        shell: cmd

      # ЭТАП 3: Запуск SUT и длительное ожидание его полной готовности
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # Автоматически находим JAR по маске (чтобы не зависеть от версии в имени)
          \$jarFile = Get-ChildItem -Path "./build/libs/" -Filter "app-order*.jar" | Select-Object -First 1
          if (\$null -eq \$jarFile) {
            Write-Error "JAR file not found in build/libs/"
            Get-ChildItem -Path "./build/libs/" -Filter "*.jar"
            exit 1
          }
          \$jarPath = \$jarFile.FullName
          Write-Host "Starting SUT from: \$jarPath"

          # Запускаем приложение в фоне
          \$process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "\$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "\$env:TMP/sut-output.log"

          # Ждём сообщение Spring Boot о готовности
          while (\$true) {
            Start-Sleep -Milliseconds 500
            \$output = Get-Content "\$env:TMP/sut-output.log" -Tail 1
            if (\$output -match 'Responding at') {
                Write-Host "✅ SUT reported readiness: \$output"
                break
            }
          }

          # Проверка порта TCP с увеличенным таймаутом (до ~4 минут)
          \$maxAttempts = 120
          \$attempt = 0
          while (\$attempt -lt \$maxAttempts) {
            try {
              \$tcp = New-Object System.Net.Sockets.TcpClient
              \$tcp.Connect("localhost", 9999)
              \$tcp.Close
              Write-Host "🟢 Port 9999 is open!"
              break
            } catch {
              Write-Host "⏳ Waiting for port... attempt \$(\$attempt + 1) of \$maxAttempts"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if (\$attempt -ge \$maxAttempts) {
            Write-Error "🛑 Failed to start SUT. Port 9999 never opened."
            Write-Host "--- Last 50 lines of SUT logs ---"
            Get-Content "\$env:TMP/sut-output.log" | Select-Object -Last 50 | ForEach-Object { Write-Host \$_ }
            Stop-Process -Id \$process.Id -Force
            exit 1
          }

          # Финальная длительная пауза для полной инициализации контекста Spring
          Write-Host "⏳ Waiting 20 seconds for full Spring context initialization..."
          Start-Sleep -Seconds 20

      # ЭТАП 4: Запуск тестов (только после полной готовности среды)
      - name: Run tests 🎯
        env:
          WEBDRIVER_CHROME_DRIVER: \${{ env.CHROME_DRIVER_PATH }}
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
