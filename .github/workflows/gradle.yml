name: Java CI with Gradle (Selenium + Spring Boot)
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: windows-latest # Windows лучше подходит для PowerShell

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      # Очистка папки libs на всякий случай
      - name: Clean old artifacts 🗑️
        run: |
          if (Test-Path "./build/libs") { Remove-Item ./build/libs/* -Force }
      
      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Собираем проект БЕЗ запуска тестов
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      # Запуск приложения и ожидание готовности
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # 1. Проверяем директорию сборки
          $libsDir = ".\build\libs"
          if (!(Test-Path $libsDir)) {
              Write-Host "🛑 Директория '$libsDir' отсутствует!"
              exit 1
          }

          # 2. Находим JAR-файл (поддерживает имена вида app-order*.jar)
          $$jarFile = Get-ChildItem -Path "$libsDir" -Filter "app-order*.jar" | Select-Object -First 1

          if ($$null -eq $$jarFile) {
            Write-Error "🛑 JAR файл не найден в $libsDir!"
            Write-Host "Доступные файлы:"
            Get-ChildItem -Path "$libsDir" -Filter "*.jar" | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }

          $$$jarPath = $$jarFile.FullName
          Write-Host "🟢 Найден JAR: $$$jarPath"

          # 3. Запускаем процесс в фоне с перенаправлением логов
          $$process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "$$$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "${env:TEMP}\sut-output.log"

          # 4. Ждём сообщение о старте Spring Boot
          $maxWaitSpring = 120
          $$attempt = 0
          while ($$attempt -lt $maxWaitSpring) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TEMP\sut-output.log" -Tail 1
            if ($output -match 'Started .* in \d+\.\d+ seconds') {
                Write-Host "🟢 Приложение сообщило о готовности: $output"
                break
            }
            $$attempt++
          }

          if ($$attempt -ge $maxWaitSpring) {
            Write-Error "🛑 Таймаут ожидания сообщения 'Started...'."
            Stop-Process -Id $$process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # 5. Проверяем порт TCP
          $maxAttempts = 60
          $$attempt = 0
          while ($$attempt -lt $maxAttempts) {
            try {
              $$tcp = New-Object System.Net.Sockets.TcpClient
              $$tcp.Connect("localhost", 9999)
              $$tcp.Close
              Write-Host "🟢 Порт 9999 открыт!"
              break
            } catch {
              Write-Host "⏳ Порт 9999 еще не открыт... ($($$attempt + 1)/$maxAttempts)"
            }
            $$attempt++
            Start-Sleep -Seconds 2
          }

          if ($$attempt -ge $maxAttempts) {
            Write-Error "🛑 Таймаут проверки порта 9999."
            Stop-Process -Id $$process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          # 6. Пауза для полной инициализации контекста
          Write-Host "⏳ Финальная пауза 10 секунд..."
          Start-Sleep -Seconds 10

      # Запускаем тесты
      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      # Загружаем отчет о тестах
      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
