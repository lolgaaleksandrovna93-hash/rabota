name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK ☕
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build application 🏗️
        run: .\gradlew.bat build -x test --no-daemon

      # Копируем jar в корень, чтобы было проще запускать
      - name: Copy jar to root
        shell: powershell
        run: |
          $jars = Get-ChildItem -Path "build/libs" -Filter "*order*.jar"
          if ($jars.Count -eq 0) {
              throw "No jar file found in build/libs matching '*order*.jar'"
          }
          Copy-Item -Path $jars[0].FullName -Destination "app-order.jar" -Force
          Write-Host "Copied jar: $($jars[0].Name)"

      - name: Start application 🚀
        id: start-app
        shell: powershell
        run: |
          # Запускаем приложение в фоне и сохраняем PID
          $process = Start-Process -FilePath java -ArgumentList "-jar", "app-order.jar", "-Dserver.port=9999" -PassThru
          echo "APP_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application started with PID $($process.Id)"

      - name: Wait for application to be ready ⏳
        shell: powershell
        run: |
          $maxTries = 60
          $try = 0
          while ($try -lt $maxTries) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:9999" -Method Head -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Application is ready."
                break
              }
            } catch {
              Write-Host "Waiting for application... try $try"
              Start-Sleep -Seconds 2
            }
            $try++
          }
          if ($try -eq $maxTries) {
            throw "❌ Application did not start in time."
          }

      - name: Run tests 🧪
        run: .\gradlew.bat test --no-daemon
        env:
          APP_URL: "http://localhost:9999"

      - name: Stop application 🛑
        if: always()
        shell: powershell
        run: |
          if (Test-Path
