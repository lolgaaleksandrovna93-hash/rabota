name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ЭТАП 0: Подготовка окружения (код + JDK)
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # ЭТАП 1: Установка браузера Chrome
      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ЭТАП 2: Сборка проекта (JAR будет в build/libs/)
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      # ЭТАП 3: Запуск приложения с ожиданием готовности 🚀
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # Автоматически находим JAR по маске app-order*.jar в build/libs
          $jarFile = Get-ChildItem -Path "./build/libs/" -Filter "app-order*.jar" | Select-Object -First 1

          if ($null -eq $jarFile) {
            Write-Error "JAR file not found in build/libs/. Доступные файлы:"
            Get-ChildItem -Path "./build/libs/" -Filter "*.jar" | ForEach-Object { Write-Host $_.Name }
            exit 1
          }

          $jarPath = $jarFile.FullName
          Write-Host "🟢 Запускаем приложение из: $jarPath"

          # Запускаем процесс в фоне
          $process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "$env:TMP/sut-output.log"

          # Ждём сообщение Spring Boot о готовности
          $maxWaitSpring = 120
          $attempt = 0
          while ($attempt -lt $maxWaitSpring) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TMP/sut-output.log" -Tail 1
            if ($output -match 'Started .* in \d+\.\d+ seconds') {
                Write-Host "✅ Приложение сообщило о готовности: $output"
                break
            }
            $attempt++
          }

          if ($attempt -ge $maxWaitSpring) {
            Write-Error "🛑 Не дождались сообщения о готовности приложения."
            Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id $process.Id -Force
            exit 1
          }

          # Проверка порта TCP (обрати внимание: $tcp.Close без скобок!)
          $maxAttempts = 120
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient
              $tcp.Connect("localhost", 9999)
              $tcp.Close
              Write-Host "🟢 Порт 9999 открыт!"
              break
            } catch {
              Write-Host "⏳ Ожидаем открытия порта... попытка $($attempt + 1)/$maxAttempts"
            }
            $attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Не удалось запустить SUT. Порт 9999 не открылся."
            Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id $process.Id -Force
            exit 1
          }

          # Финальная пауза для полной инициализации контекста Spring
          Write-Host "⏳ Дополнительная пауза на 20 секунд..."
          Start-Sleep -Seconds 20

      # ЭТАП 4: Запуск тестов 🎯
      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      # ЭТАП 5: Загрузка отчёта
      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
