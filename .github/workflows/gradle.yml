name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ЭТАП 1: Checkout кода
      - name: Checkout code 📁
        uses: actions/checkout@v4

      # ЭТАП 2: Установка JDK (ИСПРАВЛЕНО: убрано лишнее 'actions/')
      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      # ЭТАП 3: Установка Chrome
      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ЭТАП 4: Сборка проекта
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      # ЭТАП 5: Запуск SUT и ожидание готовности
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # 1. Проверяем, что файл реально появился в artifacts
          if (-not (Test-Path "./artifacts/app-order.jar")) {
            Write-Error "❌ Файл app-order.jar не найден в папке artifacts!"
            Get-ChildItem -Path "./" -Recurse -Filter "*.jar" | Select-Object -First 5 | ForEach-Object { Write-Host "Найден: $($_.FullName)" }
            exit 1
          }

          \$jarPath = "./artifacts/app-order.jar"
          Write-Host "🟢 Запускаем приложение: \$jarPath"

          # 2. Запускаем процесс
          \$process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "\$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "\$env:TMP/sut-output.log"

          # 3. Ждем сообщение о старте Spring Boot
          \$maxWaitSpring = 120
          \$attempt = 0
          while ($attempt -lt $maxWaitSpring) {
            Start-Sleep -Milliseconds 500
            # Читаем только последнюю строку, чтобы не грузить память
            $output = Get-Content "$env:TMP/sut-output.log" -Tail 1
            
            if (\$output -match 'Started .* in \d+\.\d+ seconds') {
                Write-Host "✅ Приложение сообщило о готовности: \$output"
                break
            }
            \$attempt++
          }

          if ($attempt -ge $maxWaitSpring) {
            Write-Error "🛑 Таймаут ожидания сообщения 'Started...'. Лог:"
            Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 20 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id \$process.Id -Force
            exit 1
          }

          # 4. Проверка порта TCP (ИСПРАВЛЕНО: \$tcp.Close без скобок)
          \$maxAttempts = 120
          \$attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              \$tcp = New-Object System.Net.Sockets.TcpClient
              \$tcp.Connect("localhost", 9999)
              \$tcp.Close
              Write-Host "🟢 Порт 9999 открыт!"
              break
            } catch {
              Write-Host "⏳ Порт 9999 еще не открыт... попытка $($attempt + 1)/\$maxAttempts"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Таймаут проверки порта 9999."
            Stop-Process -Id \$process.Id -Force
            exit 1
          }

          # 5. Финальная пауза для полной инициализации контекста
          Write-Host "⏳ Финальная пауза 20 секунд для полной инициализации..."
          Start-Sleep -Seconds 20

      # ЭТАП 6: Запуск тестов
      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      # ЭТАП 7: Загрузка отчета
      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
