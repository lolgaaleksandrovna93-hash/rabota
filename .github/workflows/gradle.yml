name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Start SUT and wait
        run: |
          java -jar ./artifacts/app-order.jar &
          export APP_PID=\$!
          # Wait for SUT to be ready (simple HTTP check)
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:9999 | grep -q "200"; then
              echo "SUT is ready"
              break
            fi
            echo "Waiting for SUT... attempt \$i"
            sleep 2
          done
        shell: bash

      - name: Run tests
        run: ./gradlew test
