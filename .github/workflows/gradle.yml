name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      # 1. Сначала ставим JDK, чтобы работали шаги сборки и тестов
      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 2. Ставим Chrome и Chromedriver
      # Это действие автоматически создаст переменную окружения WEBDRIVER_CHROME_DRIVER
      - name: Install Google Chrome & Driver 🦊
        uses: actions/setup-chromium@v1
        with:
          browser: chrome-stable
          driver: chromedriver

      # 3. Сборка проекта
      - name: Build project ✨
        run: .\gradlew.bat build --no-daemon

      # 4. Запуск приложения (SUT)
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          \$jarPath = "./build/libs/app-order.jar"
          
          if (!(Test-Path \$jarPath)) {
            Write-Error "Jar file not found at \$jarPath"
            exit 1
          }

          # Запускаем приложение в фоне
          Start-Process -FilePath "java" -ArgumentList "-jar", "\$jarPath"

          # Ждем, пока страница станет доступна
          \$maxAttempts = 30
          \$attempt = 0
          \$url = "http://localhost:9999"

          while ($attempt -lt $maxAttempts) {
            try {
              # Проверяем просто HEAD запрос на главную страницу
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -ErrorAction Stop
              if (\$response.StatusCode -eq 200) {
                Write-Host "🟢 SUT is ready!"
                break
              }
            } catch {
              Write-Host "⏳ Waiting for SUT... attempt $($attempt + 1)"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Failed to start SUT"
            exit 1
          }

      # 5. Запуск тестов
      # ВАЖНО: Мы НЕ передаем -Dwebdriver.chrome.driver, так как переменная WEBDRIVER_CHROME_DRIVER уже установлена действием setup-chromium
      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

