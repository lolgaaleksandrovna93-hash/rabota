name: Java CI with Gradle (Selenium + Spring Boot)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      - name: Start SUT and wait for readiness 🚀
        shell: cmd
        run: |
          @echo off
          setlocal enabledelayedexpansion

          REM 1. Поиск JAR файла (любой .jar в build/libs)
          echo [INFO] Поиск JAR-файла в build/libs...
          set "JAR_FILE="
          for %%f in (build\libs\*.jar) do (
            set "JAR_FILE=%%f"
            goto :found_jar
          )

          :found_jar
          if "%JAR_FILE%"=="" (
            echo [ERROR] КРИТИЧЕСКАЯ ОШИБКА: JAR файл не найден в build\libs!
            dir build\libs /b 2>nul
            exit /b 1
          )
          echo [SUCCESS] Найден файл: %JAR_FILE%

          REM 2. Запуск приложения в фоне
          echo [INFO] Запуск приложения...
          start /B java -jar "%JAR_FILE%" > "%TEMP%\sut-output.log" 2>&1
          set "PID=!ERRORLEVEL!"

          REM Небольшая пауза, чтобы файл лога точно создался
          timeout /t 5 /nobreak >nul

          REM 3. Ожидание строки "Started ... in X.X seconds"
          echo [INFO] Ожидание сообщения о старте Spring Boot...
          set "MAX_WAIT=120"
          set "COUNT=0"

          :wait_started
          if !COUNT! GEQ !MAX_WAIT! (
            echo [ERROR] Таймаут: приложение не запустилось за 2 минуты.
            if exist "%TEMP%\sut-output.log" (
              echo Последние 50 строк лога:
              more +50 "%TEMP%\sut-output.log"
            )
            taskkill /F /PID !PID! 2>nul
            exit /b 1
          )

          timeout /t 1 /nobreak >nul
          set /a COUNT+=1

          findstr /R /C:"Started .* in [0-9]\.[0-9]* seconds" "%TEMP%\sut-output.log" >nul
          if not errorlevel 1 (
            echo [SUCCESS] Приложение сообщило о готовности.
            goto :check_port
          )
          goto :wait_started

          REM 4. Проверка порта 9999
          :check_port
          echo [INFO] Проверка доступности порта 9999...
          set "MAX_ATTEMPTS=60"
          set "ATTEMPT=0"

          :wait_port
          if !ATTEMPT! GEQ !MAX_ATTEMPTS! (
            echo [ERROR] Таймаут: порт 9999 не открылся.
            taskkill /F /PID !PID! 2>nul
            exit /b 1
          )

          powershell -Command "try { $c = New-Object System.Net.Sockets.TcpClient('localhost', 9999); $c.Close(); exit 0 } catch { exit 1 }"
          if not errorlevel 1 (
            echo [SUCCESS] Порт 9999 открыт! SUT готов к работе.
            goto :final_pause
          )

          set /a ATTEMPT+=1
          echo [WAIT] Порт 9999 еще не открыт... (!ATTEMPT!/!MAX_ATTEMPTS!)
          timeout /t 2 /nobreak >nul
          goto :wait_port

          REM 5. Финальная пауза
          :final_pause
          echo [INFO] Финальная пауза 10 секунд для полной инициализации...
          timeout /t 10 /nobreak >nul
          echo [SUCCESS] SUT полностью готов к запуску тестов!

      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

