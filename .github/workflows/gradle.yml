name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # ИСПРАВЛЕНИЕ: Используем проверенный экшен для установки Chrome
      - name: Install Google Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome & Driver Versions
        run: |
          echo "Chrome version: \$(chrome --version)"
          echo "Driver path: \${{ env.CHROME_DRIVER_PATH }}"

      - name: Build project ✨
        run: .\gradlew.bat build --no-daemon

      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          \$jarPath = "./build/libs/app-order.jar"
          
          if (!(Test-Path \$jarPath)) {
            Write-Error "Jar file not found at \$jarPath"
            exit 1
          }

          # Запускаем в фоне
          Start-Process -FilePath "java" -ArgumentList "-jar", "\$jarPath" -NoNewWindow

          \$maxAttempts = 40
          \$attempt = 0
          \$url = "http://localhost:9999"

          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -ErrorAction Stop
              if (\$response.StatusCode -eq 200) {
                Write-Host "🟢 SUT is ready!"
                break
              }
            } catch {
              Write-Host "⏳ Waiting for SUT... attempt $($attempt + 1)"
            }
            \$attempt++
            Start-Sleep -Seconds 3 # Увеличил паузу, SUT в CI может стартовать медленнее
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Failed to start SUT. Check logs above."
            exit 1
          }

      - name: Run tests 🎯
        env:
          # Экшен setup-chrome автоматически создает эту переменную
          WEBDRIVER_CHROME_DRIVER: \${{ env.CHROME_DRIVER_PATH }}
        run: .\gradlew.bat test --no-daemon

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

