name: Java CI with Gradle (Pure Selenium)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 17 ☕️
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build project 📦
        # Компилируем проект и скачиваем зависимости
        run: .\gradlew.bat build -x test --no-daemon
        shell: cmd

      - name: Run Selenium Tests 🎯
        # ВАЖНО: В тестах URL должен быть прописан жестко (например, на демо-сайт)
        # или браться из переменной окружения, если это твой локальный сервер.
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

