name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        # Обновляем до v5, так как v4 deprecated
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ВАЖНО: Сначала собираем приложение, чтобы получить JAR-файл
      - name: Build SUT (Application) 📦
        run: .\gradlew.bat build -x test
        shell: cmd

      # Запускаем приложение в фоне и ждём готовности
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          # Путь к JAR теперь из папки build/libs (стандартная для Gradle)
          \$jarPath = "./build/libs/app-order.jar"
          
          if (!(Test-Path \$jarPath)) {
            Write-Error "Jar file not found at \$jarPath. Check build step."
            Get-ChildItem -Path "./build/libs/" -Filter "*.jar"
            exit 1
          }

          Write-Host "Starting SUT from: \$jarPath"
          
          # Запускаем процесс
          \$process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "\$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "\$env:TMP/sut-output.log"

          # Ждём сообщения "Responding at"
          while (\$true) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TMP/sut-output.log" -Tail 1
            if (\$output -match 'Responding at') {
                Write-Host "✅ SUT reported readiness: \$output"
                break
            }
          }

          # Проверка порта TCP (с исправленным синтаксисом вызова методов)
          \$maxAttempts = 120
          \$attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              \$tcp = New-Object System.Net.Sockets.TcpClient
              # ИСПРАВЛЕНИЕ: В PowerShell методы без аргументов вызываются БЕЗ скобок
              \$tcp.Connect("localhost", 9999)
              \$tcp.Close() 
              Write-Host "🟢 Port 9999 is open!"
              break
            } catch {
              Write-Host "⏳ Waiting for port... attempt $($attempt + 1) of \$maxAttempts"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Failed to start SUT. Port 9999 never opened."
            Write-Host "--- Last 50 lines of SUT logs ---"
            Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 50 | ForEach-Object { Write-Host $_ }
            Stop-Process -Id \$process.Id -Force
            exit 1
          }

          # Увеличенная пауза для полной инициализации контекста Spring
          Write-Host "⏳ Waiting 15 seconds for full Spring context initialization..."
          Start-Sleep -Seconds 15

      # Запуск тестов
      - name: Run tests 🎯
        env:
          WEBDRIVER_CHROME_DRIVER: \${{ env.CHROME_DRIVER_PATH }}
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

