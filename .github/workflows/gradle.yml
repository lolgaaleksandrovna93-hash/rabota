name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Chrome & Driver 🦊
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # Запускаем приложение в фоне и ждём сообщений от него
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          $jarPath = "./artifacts/app-order.jar"
          if (!(Test-Path $jarPath)) {
            Write-Error "Jar file not found at $jarPath"
            exit 1
          }

          # Запускаем процесс с захватом stdout для мониторинга
          $process = Start-Process `
              -FilePath "java" `
              -ArgumentList "-jar", "$jarPath" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "$env:TMP/sut-output.log"

          # Ждём до тех пор, пока сервер не сообщит о своей готовности
          while ($true) {
            Start-Sleep -Milliseconds 500
            $output = Get-Content "$env:TMP/sut-output.log" | Select-Object -Last 1
            if ($output -match 'Responding at') { # Сообщение из Spring Boot
                break;
            }
          }

          # Теперь проверим порт TCP
          $maxAttempts = 60
          $attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient
              $tcp.Connect("localhost", 9999) # Правильный вызов метода
              $tcp.Close()
              Write-Host "🟢 Port 9999 is open!"
              break
            } catch {
              Write-Host "⏳ Waiting for port... attempt $($attempt + 1)"
            }
            $attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Failed to start SUT. Port 9999 never opened."
            Stop-Process -Id $process.Id -Force
            exit 1
          }

          # Пауза перед тестами для полной инициализации контекста
          Start-Sleep -Seconds 5

      # Передаём путь к драйверу в переменную окружения
      - name: Run tests 🎯
        env:
          WEBDRIVER_CHROME_DRIVER: ${{ env.CHROME_DRIVER_PATH }}
        run: .\gradlew.bat test --no-daemon
        shell: cmd

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
