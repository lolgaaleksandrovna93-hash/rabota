name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code 📁
        uses: actions/checkout@v4

      # Установка браузера и драйверов через официальное действие
      - name: Install Google Chrome 🦊
        uses: actions/setup-chromium@v1
        with:
          browser: chrome-stable
          driver: chromedriver
          # Это действие автоматически добавляет переменную окружения WEBDRIVER_CHROME_DRIVER,
          # поэтому в gradlew.bat test не нужно передавать путь к драйверу вручную.
      
      - name: Set up JDK 11 ☕️
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build project ✨
        run: .\gradlew.bat build --no-daemon

      # Запускаем приложение с профилем "ci", чтобы отключить логирование и другие лишние вещи
      - name: Start SUT and wait for readiness 🚀
        shell: pwsh
        run: |
          $jarPath = "./build/libs/app-order.jar" # Проверьте имя вашего jar!
          
          if (!(Test-Path $jarPath)) {
            Write-Error "Jar file not found at $jarPath"
            exit 1
          }

          # Запускаем с флагом ci, если он у вас есть в Spring Boot приложении
          Start-Process -FilePath "java" -ArgumentList "-jar", "$jarPath", "--server.port=9999", "--spring.profiles.active=ci"

          # Проверяем готовность по конкретному маршруту /actuator/health или другому вашему эндпоинту
          $maxAttempts = 30
          $attempt = 0
          $url = "http://localhost:9999/actuator/health"

          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Get -TimeoutSec 5 -ErrorAction Stop | ConvertFrom-Json
              if ($response.status -eq "UP") { # Или другой ваш статус успеха
                Write-Host "🟢 SUT is ready!"
                break
              }
            } catch {}
            
            $attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Failed to start SUT"
            exit 1
          }

      - name: Run tests 🎯
        run: .\gradlew.bat test --no-daemon

      - name: Upload Test Report 🗃️
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
