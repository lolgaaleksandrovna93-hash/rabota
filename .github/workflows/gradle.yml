name: Java CI with Gradle (Windows CI)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 1. Сборка проекта (создает jar-файл)
      - name: Build project
        run: .\gradlew.bat build --no-daemon

      # 2. Запуск SUT (System Under Test)
      - name: Start SUT and wait for readiness
        shell: pwsh
        run: |
          # ВАЖНО: Проверьте путь к вашему jar-файлу.
          # Если в build.gradle указано destinationDirectory = file('artifacts'), используйте:
          # \$jarPath = ".\artifacts\app-order.jar"
          # Если нет (стандартная сборка), используйте:
          \$jarPath = ".\build\libs\app-order.jar"

          if (!(Test-Path \$jarPath)) {
            Write-Error "Jar file not found at \$jarPath. Check build.gradle configuration."
            exit 1
          }

          Write-Host "Starting SUT from \$jarPath"
          
          # Запускаем приложение в фоне
          Start-Process -FilePath "java" -ArgumentList "-jar", \$jarPath

          # Ждем, пока порт 9999 станет доступен (или появится сообщение в логах)
          \$maxAttempts = 30
          \$attempt = 0
          \$url = "http://localhost:9999"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -ErrorAction Stop
              if (\$response.StatusCode -eq 200) {
                Write-Host "✅ SUT is ready!"
                break
              }
            } catch {
              Write-Host "⏳ Waiting for SUT... attempt $($attempt + 1)"
            }
            \$attempt++
            Start-Sleep -Seconds 2
          }

          if ($attempt -eq $maxAttempts) {
            Write-Error "❌ Failed to start SUT within timeout."
            exit 1
          }

      # 3. Запуск тестов
      - name: Run tests
        run: .\gradlew.bat test --no-daemon

      # 4. Загрузка отчетов (даже если тесты упали)
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

